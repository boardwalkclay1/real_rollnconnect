<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roll ’n Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="css/app.css">

  <!-- Clerk (correct initialization) -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="YOUR_PUBLISHABLE_KEY_HERE"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      // Wait for Clerk to load safely
      if (window.Clerk) {
        await Clerk.load();

        // If already signed in → go to dashboard
        if (Clerk.user) {
          window.location.href = "rc-dash.html";
          return;
        }
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url("image/rnc.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-x: hidden;
      color: white;
      font-family: system-ui, sans-serif;
    }

    .landing-wrapper {
      position: relative;
      z-index: 5;
      padding: 40px 20px;
      text-align: center;
    }

    .hero-title {
      font-size: 2.6rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

    .hero-sub {
      font-size: 1.2rem;
      opacity: 0.85;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .cta-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .cta-buttons a {
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      transition: 0.25s ease;
    }

    .cta-buttons a:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <!-- Stars only load if they exist -->
  <div class="stars1"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="landing-wrapper">
    <h1 class="hero-title">Roll ’n Connect</h1>
    <p class="hero-sub">
      Discover spots. Join events. Track sessions.
    </p>

    <div class="cta-buttons">
      <a href="login.html">Sign In</a>
      <a href="login.html#/sign-up">Create Account</a>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
