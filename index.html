<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roll ’n Connect — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="css/app.css">

  <!-- Clerk -->
  <script
    async
    crossorigin="anonymous"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
  </script>

  <script>
    window.addEventListener("load", async () => {
      await Clerk.load();

      // Redirect if already signed in
      if (Clerk.user) {
        window.location.href = "rc-dash.html";
      }
    });
  </script>
</head>

<body>
  <div class="stars1"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <header class="app-header">
    <h1>Roll ’n Connect</h1>
  </header>

  <main class="landing">
    <section class="hero glass">
      <h2>Welcome Back</h2>
      <p style="margin-bottom: 24px; opacity: 0.85;">
        Sign in to discover spots, join events, and track your sessions.
      </p>

      <!-- Clerk Login Component -->
      <div id="login-box" class="glass" style="padding: 20px; border-radius: 16px;">
        <sign-in
          routing="hash"
          redirect-url="rc-dash.html"
          appearance="{
            elements: {
              formButtonPrimary: 'btn primary',
              formFieldInput: 'input bubble',
              card: 'glass'
            }
          }">
        </sign-in>
      </div>

      <p style="margin-top: 20px; opacity: 0.7;">
        New here?
        <a href="#/sign-up" style="color: #fff; text-decoration: underline;">Create an account</a>
      </p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
